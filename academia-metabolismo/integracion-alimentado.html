<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🫀 Integración entre órganos | Academia de Metabolismo</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f7f6;margin:0;color:#243238}
.contenedor{max-width:800px;margin:35px auto;padding:20px}
.encabezado{text-align:center;margin-bottom:25px}
.encabezado h1{color:#1e6f8b;font-size:38px;margin-bottom:8px}
.encabezado p{color:#555;font-size:18px}
.panel-superior{display:flex;gap:15px;margin-bottom:15px}
.dato{background:#fff;border-radius:12px;padding:12px 18px;flex:1;text-align:center;border:1px solid #dce5e4}
.dato strong{display:block;color:#1e6f8b;font-size:20px;margin-top:4px}
.barra-contenedor{width:100%;height:14px;background:#dbe5e3;border-radius:20px;overflow:hidden;margin-bottom:22px}
.barra{height:100%;width:20%;background:#2e8b57;transition:width .4s}
.tarjeta{background:#fff;padding:30px;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.09)}
.etiqueta{display:inline-block;background:#dceaf5;color:#1e5f80;padding:7px 13px;border-radius:20px;font-weight:bold;margin-bottom:15px}
.pregunta{font-size:22px;line-height:1.45;margin-bottom:22px}
.alternativa{display:block;background:#f7f9f9;border:2px solid #d9e2e3;border-radius:12px;padding:15px;margin:12px 0;cursor:pointer}
.alternativa:hover{background:#eef5f3;border-color:#9dbdb5}
.alternativa input{margin-right:10px}
.botones{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}
.boton{background:#2e8b57;color:#fff;border:none;border-radius:12px;padding:14px 24px;font-size:17px;cursor:pointer;text-decoration:none;display:inline-block}
.boton:hover{background:#247247}
.boton-secundario{background:#1e6f8b}
#retroalimentacion{display:none;margin-top:22px;padding:18px;border-radius:12px;line-height:1.55}
.correcta{background:#e1f4e8;border-left:6px solid #2e8b57}
.incorrecta{background:#fde8e8;border-left:6px solid #b64646}
.resultado-final{text-align:center}
.resultado-final h2{color:#1e6f8b;font-size:30px}
.resultado-numero{font-size:42px;color:#2e8b57;font-weight:bold}
.guardado{background:#edf5fa;border-radius:10px;padding:12px;margin:18px 0;color:#1e5f80}
.volver{display:inline-block;margin-top:25px;color:#1e6f8b;text-decoration:none}
@media(max-width:600px){.panel-superior{flex-direction:column}.tarjeta{padding:22px}.pregunta{font-size:20px}}
</style>
</head>
<body>
<main class="contenedor">
<header class="encabezado"><h1>🫀 Integración entre órganos</h1><p>Estado alimentado y coordinación metabólica</p></header>
<section class="panel-superior">
<div class="dato">Pregunta<strong id="numero-pregunta">1 de 5</strong></div>
<div class="dato">Puntaje<strong id="puntaje">0</strong></div>
</section>
<div class="barra-contenedor"><div class="barra" id="barra-progreso"></div></div>
<section class="tarjeta" id="tarjeta-pregunta">
<span class="etiqueta" id="tema-pregunta"></span>
<p class="pregunta" id="texto-pregunta"></p>
<div id="alternativas"></div>
<div class="botones">
<button class="boton" id="boton-comprobar" onclick="comprobarRespuesta()">Comprobar respuesta</button>
<button class="boton boton-secundario" id="boton-siguiente" onclick="siguientePregunta()" style="display:none">Siguiente</button>
</div>
<div id="retroalimentacion"></div>
</section>
<a class="volver" href="menu-alimentado.html">← Volver a la ruta de Estado alimentado</a>
</main>
<script>
const CLAVE_PROGRESO = "progreso_integracion_alimentado";
const preguntas = [
{tema:"Intestino e hígado",pregunta:"Después de una comida rica en carbohidratos, la glucosa absorbida llega primero al hígado por la vena porta. ¿Cuál respuesta es esperable?",alternativas:["Aumentar la glucogenólisis.","Aumentar la glucogénesis y la glucólisis.","Aumentar la cetogénesis.","Aumentar la gluconeogénesis."],correcta:1,explicacion:"En presencia de insulina, el hígado favorece el uso de glucosa y su almacenamiento.",concepto:"Glucosa portal → hígado → utilización y almacenamiento.",error:"La respuesta seleccionada corresponde a una baja disponibilidad de glucosa."},
{tema:"Hígado y músculo",pregunta:"¿Qué diferencia importante existe entre hígado y músculo respecto de la captación de glucosa?",alternativas:["Ambos dependen exclusivamente de GLUT4.","El hígado utiliza GLUT2 y el músculo aumenta GLUT4 en respuesta a insulina.","El músculo utiliza GLUT2 y el hígado GLUT4.","Ninguno capta glucosa en presencia de insulina."],correcta:1,explicacion:"El hepatocito utiliza GLUT2, mientras la insulina estimula GLUT4 en músculo.",concepto:"Hígado: GLUT2. Músculo: GLUT4.",error:"Se confundieron los transportadores propios de cada tejido."},
{tema:"Tejido adiposo",pregunta:"Después de una comida, el tejido adiposo recibe glucosa y ácidos grasos. ¿Qué proceso se favorece?",alternativas:["Síntesis y almacenamiento de triacilglicéridos.","Liberación de ácidos grasos por lipólisis.","Formación de cuerpos cetónicos.","Producción de glucosa para la sangre."],correcta:0,explicacion:"La insulina favorece el almacenamiento de ácidos grasos como triacilglicéridos.",concepto:"Adipocito postprandial → almacenamiento de TAG.",error:"La alternativa elegida corresponde al ayuno o atribuye al adipocito una función que no posee."},
{tema:"Coordinación hormonal",pregunta:"¿Qué efecto coordinado produce la insulina en hígado, músculo y tejido adiposo?",alternativas:["Estimula la movilización de todas las reservas.","Favorece el almacenamiento y reduce la liberación de combustibles.","Estimula la cetogénesis en los tres tejidos.","Activa la gluconeogénesis en todos los órganos."],correcta:1,explicacion:"La insulina coordina captación, utilización y almacenamiento de nutrientes.",concepto:"Insulina → respuesta anabólica coordinada.",error:"Se razonó como si predominara el ayuno."},
{tema:"Integración general",pregunta:"Una persona consume una comida rica en carbohidratos y lípidos. ¿Qué secuencia representa mejor la respuesta integrada?",alternativas:["Aumenta insulina → músculo capta glucosa → hígado sintetiza glucógeno → adipocito almacena triacilglicéridos.","Disminuye insulina → hígado produce cuerpos cetónicos → adipocito activa lipólisis.","Aumenta glucagón → músculo libera glucosa → adipocito produce cuerpos cetónicos.","Aumenta cortisol → todos los tejidos movilizan reservas."],correcta:0,explicacion:"La insulina coordina captación de glucosa y almacenamiento en los distintos órganos.",concepto:"Estado alimentado = coordinación anabólica.",error:"La secuencia elegida corresponde a ayuno o estrés."}
];

let preguntaActual=0,puntaje=0,respuestaComprobada=false,alternativasActuales=[];

function mezclarAlternativas(pregunta){
 alternativasActuales=pregunta.alternativas.map((texto,indiceOriginal)=>({texto,indiceOriginal}));
 for(let i=alternativasActuales.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [alternativasActuales[i],alternativasActuales[j]]=[alternativasActuales[j],alternativasActuales[i]];
 }
}

function mostrarPregunta(){
 respuestaComprobada=false;
 const p=preguntas[preguntaActual];
 document.getElementById("numero-pregunta").textContent=`${preguntaActual+1} de ${preguntas.length}`;
 document.getElementById("puntaje").textContent=puntaje;
 document.getElementById("tema-pregunta").textContent=p.tema;
 document.getElementById("texto-pregunta").textContent=p.pregunta;
 document.getElementById("barra-progreso").style.width=((preguntaActual+1)/preguntas.length*100)+"%";
 const cont=document.getElementById("alternativas"); cont.innerHTML="";
 mezclarAlternativas(p);
 alternativasActuales.forEach(a=>{
  const label=document.createElement("label"); label.className="alternativa";
  label.innerHTML=`<input type="radio" name="respuesta" value="${a.indiceOriginal}"> ${a.texto}`;
  cont.appendChild(label);
 });
 const r=document.getElementById("retroalimentacion"); r.style.display="none"; r.innerHTML="";
 document.getElementById("boton-comprobar").style.display="inline-block";
 document.getElementById("boton-siguiente").style.display="none";
 document.getElementById("boton-siguiente").textContent="Siguiente";
}

function comprobarRespuesta(){
 if(respuestaComprobada)return;
 const sel=document.querySelector('input[name="respuesta"]:checked');
 const r=document.getElementById("retroalimentacion");
 if(!sel){r.style.display="block";r.className="incorrecta";r.innerHTML="<strong>Selecciona una alternativa antes de comprobar.</strong>";return;}
 respuestaComprobada=true;
 const p=preguntas[preguntaActual];
 const ok=Number(sel.value)===p.correcta;
 if(ok){
  puntaje++; document.getElementById("puntaje").textContent=puntaje;
  r.className="correcta";
  r.innerHTML=`<strong>✅ Respuesta correcta.</strong><p>${p.explicacion}</p><p><strong>Concepto clave:</strong> ${p.concepto}</p>`;
 }else{
  r.className="incorrecta";
  r.innerHTML=`<strong>❌ Respuesta incorrecta.</strong><p>${p.explicacion}</p><p><strong>Respuesta correcta:</strong> ${p.alternativas[p.correcta]}</p><p><strong>Análisis del error:</strong> ${p.error}</p>`;
 }
 r.style.display="block";
 document.querySelectorAll('input[name="respuesta"]').forEach(i=>i.disabled=true);
 document.getElementById("boton-comprobar").style.display="none";
 document.getElementById("boton-siguiente").style.display="inline-block";
 if(preguntaActual===preguntas.length-1)document.getElementById("boton-siguiente").textContent="Ver resultado";
}

function siguientePregunta(){
 preguntaActual++;
 if(preguntaActual<preguntas.length)mostrarPregunta(); else mostrarResultadoFinal();
}

function guardarResultado(porcentaje){
 const anterior=JSON.parse(localStorage.getItem(CLAVE_PROGRESO)||"null");
 const nuevo={puntaje,total:preguntas.length,porcentaje,fecha:new Date().toLocaleDateString("es-CL")};
 if(!anterior || porcentaje>anterior.porcentaje)localStorage.setItem(CLAVE_PROGRESO,JSON.stringify(nuevo));
 return JSON.parse(localStorage.getItem(CLAVE_PROGRESO));
}

function mostrarResultadoFinal(){
 const porcentaje=Math.round(puntaje/preguntas.length*100);
 const mejor=guardarResultado(porcentaje);
 let mensaje=porcentaje===100?"Excelente. Dominas este nivel.":porcentaje>=60?"Buen trabajo. El nivel queda completado.":"Conviene repasar y repetir la práctica.";
 document.getElementById("barra-progreso").style.width="100%";
 document.getElementById("tarjeta-pregunta").innerHTML=`
 <div class="resultado-final">
 <h2>Práctica completada</h2>
 <p class="resultado-numero">${puntaje} / ${preguntas.length}</p>
 <p>Resultado: ${porcentaje} %</p>
 <p>${mensaje}</p>
 <div class="guardado">💾 Mejor resultado guardado: <strong>${mejor.porcentaje} %</strong></div>
 <div class="botones" style="justify-content:center">
 <button class="boton" onclick="location.reload()">Repetir práctica</button>
 <a class="boton boton-secundario" href="menu-alimentado.html">Ver mi progreso</a>
 </div></div>`;
}

mostrarPregunta();
</script>
</body>
</html>
